---
- name: Verify
  hosts: instance
  become: true
  vars:
    domains:
      - name: molecule-test.local
        marker_file: /tmp/cert-renewed-marker-first
      - name: second-domain.local
        marker_file: /tmp/cert-renewed-marker-second

  tasks:
    - name: Verify step-cli is installed
      ansible.builtin.command: step version
      register: step_version
      changed_when: false

    - name: Assert step-cli is installed
      ansible.builtin.assert:
        that:
          - step_version.rc == 0
        fail_msg: "step-cli is not installed"

    - name: Verify certificates for each domain
      ansible.builtin.include_tasks: verify_domain.yml
      loop: "{{ domains }}"
      loop_control:
        loop_var: domain
